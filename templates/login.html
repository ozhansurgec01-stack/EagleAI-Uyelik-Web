<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EagleAI - Giriş</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;font-family:Arial,sans-serif;color:#182230}
.card{width:min(360px,calc(100% - 40px));box-sizing:border-box;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}
h1{font-size:24px;margin:0 0 8px}p{color:#667085}
label{display:block;margin:20px 0 8px}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:8px;font-size:16px}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:#174ea6;color:white;font-size:16px}
.error{color:#b42318}
</style>
</head>
<body><main class="card">
<h1>EagleAI</h1><p>Devam etmek için şifrenizi girin.</p>
{% if hata %}<p class="error">{{ hata }}</p>{% endif %}
<form method="post" action="{{ url_for('login') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="password">Giriş şifresi</label>
<input id="password" name="password" type="password" required autocomplete="current-password" autofocus>
<button type="submit">Giriş yap</button>
</form></main></body></html>
