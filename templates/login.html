<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101735">
<title>EagleAI - Giriş</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  display:grid;place-items:center;padding:24px 16px;
  font-family:Arial,Helvetica,sans-serif;color:#f8fafc;
  background:
    radial-gradient(ellipse at 15% 15%,#3349a566 0,transparent 42%),
    radial-gradient(ellipse at 85% 85%,#842ce455 0,transparent 40%),
    linear-gradient(135deg,#080d20,#131d40 55%,#17102d);
}
.page{width:100%;max-width:410px}
.brand{text-align:center;margin-bottom:22px}
.logo{
  width:82px;height:82px;margin:0 auto 14px;
  display:grid;place-items:center;border-radius:25px;
  font-size:45px;
  background:linear-gradient(145deg,#6d8cff,#7139d8);
  box-shadow:0 12px 38px #5b5be766,inset 0 1px #ffffff66;
  border:1px solid #ffffff30
}
.brand h1{margin:0;font-size:30px;letter-spacing:2px;font-weight:800}
.brand h1 span{color:#80a5ff}
.tagline{margin:9px 0 0;color:#b6c3e4;font-size:14px}
.card{
  width:100%;padding:30px 26px;border-radius:23px;
  background:linear-gradient(145deg,#202c4deF,#141d38f5);
  border:1px solid #ffffff20;
  box-shadow:0 24px 70px #0007,inset 0 1px #ffffff12;
  backdrop-filter:blur(16px)
}
.card h2{margin:0 0 8px;font-size:23px}
.intro{margin:0 0 24px;color:#b5c2df;font-size:14px;line-height:1.6}
label{display:block;margin:18px 0 9px;font-size:14px;font-weight:700;color:#e4eaff}
.input-wrap{position:relative}
input{
  display:block;width:100%;padding:14px 13px;
  border:1px solid #64749a88;border-radius:11px;
  background:#0c1430;color:white;font-size:16px;outline:none;
  transition:border-color .2s,box-shadow .2s
}
input:focus{border-color:#86a5ff;box-shadow:0 0 0 3px #6285ff2c}
button{
  width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;
  background:linear-gradient(100deg,#4778ff,#7952ed);
  color:white;font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:0 8px 22px #4b55dd55;transition:transform .2s,filter .2s
}
button:hover{filter:brightness(1.12)}
button:active{transform:scale(.99)}
.error{
  margin:0 0 16px;padding:12px 13px;border-radius:10px;
  color:#fecaca;background:#7f1d1d55;border:1px solid #f8717155;
  font-size:14px
}
.links{text-align:center;margin-top:21px}
.links a{color:#a9c1ff;font-size:14px;text-decoration:none}
.links a:hover{color:white;text-decoration:underline}
.secure{margin:22px 0 0;text-align:center;color:#8494b8;font-size:12px}
@media(max-width:380px){.card{padding:25px 20px}.brand h1{font-size:27px}.logo{width:72px;height:72px;font-size:39px}}
</style>
</head>
<body>
<main class="page">
  <header class="brand">
    <div class="logo" aria-label="Kartal simgesi">🦅</div>
    <h1>EAGLE<span>AI</span></h1>
    <p class="tagline">Akıllı Yönetim · Güçlü Kontrol</p>
  </header>

  <section class="card">
    <h2>Hoş geldiniz</h2>
    <p class="intro">Yönetim paneline devam etmek için giriş şifrenizi girin.</p>

    {% if hata %}
    <p class="error" role="alert">{{ hata }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">Giriş şifresi</label>
      <div class="input-wrap">
        <input id="password" name="password" type="password"
          required autocomplete="current-password" autofocus
          placeholder="Şifrenizi girin">
      </div>
      <button type="submit">Giriş Yap&nbsp; →</button>
    </form>

    <div class="links">
      <a href="{{ url_for('change_password') }}">🔑 Şifre Değiştir</a>
    </div>
  </section>

  <p class="secure">🛡️ Güvenli erişim · EagleAI Yönetim Sistemi</p>
</main>
</body>
</html>
