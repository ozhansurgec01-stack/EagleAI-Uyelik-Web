<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EagleAI - Şifre Değiştir</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f9;font-family:Arial,sans-serif;color:#182230}
.card{width:min(400px,calc(100% - 40px));box-sizing:border-box;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 30px #0001}
label{display:block;margin:16px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:8px;font-size:16px}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#174ea6;color:white;font-size:16px}
.error{color:#b42318}.success{color:#067647}
</style></head><body><main class="card">
<h2>Şifre değiştir</h2>
{% if hata %}<p class="error">{{ hata }}</p>{% endif %}
{% if mesaj %}<p class="success">{{ mesaj }}</p>{% endif %}
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Mevcut şifre</label><input type="password" name="current_password" required autocomplete="current-password">
<label>Yeni şifre (en az 12 karakter)</label><input type="password" name="new_password" required minlength="12" autocomplete="new-password">
<label>Yeni şifreyi doğrula</label><input type="password" name="confirm_password" required minlength="12" autocomplete="new-password">
<button type="submit">Şifreyi değiştir</button>
</form>
<p><a href="{{ url_for('dashboard') }}">Yönetim paneline dön</a></p>
<form method="post" action="{{ url_for('logout') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Çıkış yap</button></form>
</main></body></html>
